name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version (must match Cargo.toml); rehearsal never publishes'
        required: true
        default: v0.0.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Re-run the entire CI suite on THIS commit, including Kubernetes and UI checks.
  checks:
    uses: ./.github/workflows/ci.yml

  prepare:
    runs-on: ubuntu-26.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - id: version
        name: Validate release commit and version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          actual=$(nix develop -c cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "genkanctl") | .version')
          test "$VERSION" = "v$actual"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - name: Build immutable candidates
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          # mkShell supplies its own epoch; set the commit epoch after entering it.
          nix develop -c env SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" bash scripts/release-build.sh "$VERSION" "$ARCH" dist
      - name: Smoke the exact archive and image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: nix develop -c bash scripts/release-smoke.sh "dist/genkanctl-$VERSION-linux-$ARCH.tar.gz" "genkan:release-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: candidates
      - id: publish
        name: Publish candidates by digest, sign and stage draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: nix develop -c bash scripts/release-publish.sh "$VERSION" candidates

  rehearse:
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - name: Download draft assets, verify and execute
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          nix develop -c gh release download "$VERSION" --dir downloaded
          nix develop -c bash scripts/release-verify.sh "$VERSION" "$ARCH" downloaded "$IMAGE" \
            "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$VERSION"

  finalize:
    needs: [prepare, rehearse]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      - name: Make verified release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "$VERSION" --draft=false --prerelease
